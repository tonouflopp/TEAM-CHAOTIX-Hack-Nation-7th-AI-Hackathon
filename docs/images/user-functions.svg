<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="776" viewBox="0 0 1300 776" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
  <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1b33"/></marker>
  <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker>
  <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#166534"/></marker>
  <marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b21b6"/></marker>
  <marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52627a"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1299" height="775" rx="18" fill="#ffffff" stroke="#c9d3e0"/>
<text x="32" y="46" font-size="22" font-weight="700" fill="#0b1b33">What people do with Sage</text>
<text x="32" y="70" font-size="13.5" fill="#52627a">Experts teach while they work; new hires learn the same workflow with the expert's reasons and limits.</text>
<rect x="30" y="110" width="150" height="170" rx="10" fill="#0b1b33" stroke="#0b1b33" stroke-width="1.2"/>
<text x="105" y="176.25" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">TEACH</text>
<text x="105" y="194.75" text-anchor="middle" font-size="12" fill="#c7d2e3">Experts capture</text>
<text x="105" y="211.25" text-anchor="middle" font-size="12" fill="#c7d2e3">how they work</text>
<text x="105" y="227.75" text-anchor="middle" font-size="12" fill="#c7d2e3">and why</text>
<rect x="200" y="110" width="161.66666666666666" height="170" rx="10" fill="#ffffff" stroke="#c9d3e0" stroke-width="1.2"/>
<text x="214" y="134" text-anchor="start" font-size="14.5" font-weight="700" fill="#0b1b33">1 · Start</text>
<text x="214" y="152.5" text-anchor="start" font-size="12" fill="#52627a">By voice ("I want to</text>
<text x="214" y="169" text-anchor="start" font-size="12" fill="#52627a">teach") or one click.</text>
<text x="214" y="185.5" text-anchor="start" font-size="12" fill="#52627a">Privacy notice first.</text>
<rect x="381.66666666666663" y="110" width="161.66666666666666" height="170" rx="10" fill="#ffffff" stroke="#c9d3e0" stroke-width="1.2"/>
<text x="395.66666666666663" y="134" text-anchor="start" font-size="14.5" font-weight="700" fill="#0b1b33">2 · Work normally</text>
<text x="395.66666666666663" y="152.5" text-anchor="start" font-size="12" fill="#52627a">Sage watches the screen</text>
<text x="395.66666666666663" y="169" text-anchor="start" font-size="12" fill="#52627a">from a floating widget</text>
<text x="395.66666666666663" y="185.5" text-anchor="start" font-size="12" fill="#52627a">over any application.</text>
<path d="M361.66666666666663,195 L379.66666666666663,195" fill="none" stroke="#52627a" stroke-width="1.6"  marker-end="url(#a-muted)" />
<rect x="563.3333333333333" y="110" width="161.66666666666666" height="170" rx="10" fill="#ffffff" stroke="#c9d3e0" stroke-width="1.2"/>
<text x="577.3333333333333" y="134" text-anchor="start" font-size="14.5" font-weight="700" fill="#0b1b33">3 · Explain the why</text>
<text x="577.3333333333333" y="152.5" text-anchor="start" font-size="12" fill="#52627a">At natural pauses Sage</text>
<text x="577.3333333333333" y="169" text-anchor="start" font-size="12" fill="#52627a">asks one short question:</text>
<text x="577.3333333333333" y="185.5" text-anchor="start" font-size="12" fill="#52627a">reasons and limits.</text>
<path d="M543.3333333333333,195 L561.3333333333333,195" fill="none" stroke="#52627a" stroke-width="1.6"  marker-end="url(#a-muted)" />
<rect x="745" y="110" width="161.66666666666666" height="170" rx="10" fill="#dcfce7" stroke="#86c99a" stroke-width="1.2"/>
<text x="759" y="134" text-anchor="start" font-size="14.5" font-weight="700" fill="#166534">4 · Off the record</text>
<text x="759" y="152.5" text-anchor="start" font-size="12" fill="#52627a">Pause capture any time.</text>
<text x="759" y="169" text-anchor="start" font-size="12" fill="#52627a">Only a gap marker</text>
<text x="759" y="185.5" text-anchor="start" font-size="12" fill="#52627a">remains.</text>
<path d="M725,195 L743,195" fill="none" stroke="#52627a" stroke-width="1.6"  marker-end="url(#a-muted)" />
<rect x="926.6666666666666" y="110" width="161.66666666666666" height="170" rx="10" fill="#ffffff" stroke="#c9d3e0" stroke-width="1.2"/>
<text x="940.6666666666666" y="134" text-anchor="start" font-size="14.5" font-weight="700" fill="#0b1b33">5 · Save</text>
<text x="940.6666666666666" y="152.5" text-anchor="start" font-size="12" fill="#52627a">Topic title, blurred</text>
<text x="940.6666666666666" y="169" text-anchor="start" font-size="12" fill="#52627a">thumbnail, redacted</text>
<text x="940.6666666666666" y="185.5" text-anchor="start" font-size="12" fill="#52627a">timeline.</text>
<path d="M906.6666666666666,195 L924.6666666666666,195" fill="none" stroke="#52627a" stroke-width="1.6"  marker-end="url(#a-muted)" />
<rect x="1108.3333333333333" y="110" width="161.66666666666666" height="170" rx="10" fill="#ffffff" stroke="#c9d3e0" stroke-width="1.2"/>
<text x="1122.3333333333333" y="134" text-anchor="start" font-size="14.5" font-weight="700" fill="#0b1b33">6 · Review</text>
<text x="1122.3333333333333" y="152.5" text-anchor="start" font-size="12" fill="#52627a">Session replay and</text>
<text x="1122.3333333333333" y="169" text-anchor="start" font-size="12" fill="#52627a">auto-built Work Map</text>
<text x="1122.3333333333333" y="185.5" text-anchor="start" font-size="12" fill="#52627a">per workflow.</text>
<path d="M1088.3333333333333,195 L1106.3333333333333,195" fill="none" stroke="#52627a" stroke-width="1.6"  marker-end="url(#a-muted)" />
<rect x="30" y="330" width="150" height="110" rx="10" fill="#fef3c7" stroke="#e9b949" stroke-width="1.2"/>
<text x="105" y="374.5" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">WORK MAP</text>
<text x="105" y="393" text-anchor="middle" font-size="12" fill="#52627a">Shared org</text>
<text x="105" y="409.5" text-anchor="middle" font-size="12" fill="#52627a">knowledge</text>
<rect x="200" y="330" width="1070" height="110" rx="12" fill="#fef3c7" stroke="#e9b949" stroke-width="1.2"/>
<text x="218" y="358" font-size="13" font-weight="700" fill="#92400e">Every session becomes a structured, searchable map, grouped by workflow (invoices, claims, KYC…)</text>
<rect x="218" y="378" width="56.5" height="26" rx="13" fill="#ffffff" stroke="#c9d3e0"/><text x="246.25" y="395.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0b1b33">Steps</text>
<rect x="284.5" y="378" width="84.1" height="26" rx="13" fill="#ffffff" stroke="#c9d3e0"/><text x="326.55" y="395.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0b1b33">Decisions</text>
<rect x="378.6" y="378" width="222.10000000000002" height="26" rx="13" fill="#ffffff" stroke="#c9d3e0"/><text x="489.65000000000003" y="395.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0b1b33">Reasons in the expert's words</text>
<rect x="610.7" y="378" width="249.70000000000002" height="26" rx="13" fill="#fef3c7" stroke="#e9b949"/><text x="735.5500000000001" y="395.5" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Guardrails: limits and exceptions</text>
<rect x="870.4000000000001" y="378" width="208.3" height="26" rx="13" fill="#ffffff" stroke="#c9d3e0"/><text x="974.5500000000001" y="395.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0b1b33">Screen moment for each item</text>
<rect x="1088.7" y="378" width="125.5" height="26" rx="13" fill="#dcfce7" stroke="#86c99a"/><text x="1151.45" y="395.5" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Off-record gaps</text>
<text x="218" y="428" font-size="12" fill="#52627a">Read by the lesson player and served to the voice agent through the guardrails MCP server.</text>
<rect x="30" y="490" width="150" height="170" rx="10" fill="#eaf1fe" stroke="#9dbaf5" stroke-width="1.2"/>
<text x="105" y="556.25" text-anchor="middle" font-size="16" font-weight="700" fill="#2563eb">LEARN</text>
<text x="105" y="574.75" text-anchor="middle" font-size="12" fill="#52627a">New hires learn</text>
<text x="105" y="591.25" text-anchor="middle" font-size="12" fill="#52627a">from the people</text>
<text x="105" y="607.75" text-anchor="middle" font-size="12" fill="#52627a">who do the job</text>
<rect x="200" y="490" width="198" height="170" rx="10" fill="#ffffff" stroke="#c9d3e0" stroke-width="1.2"/>
<text x="214" y="514" text-anchor="start" font-size="14.5" font-weight="700" fill="#0b1b33">1 · Find a class</text>
<text x="214" y="532.5" text-anchor="start" font-size="12" fill="#52627a">Catalogue of org and</text>
<text x="214" y="549" text-anchor="start" font-size="12" fill="#52627a">own sessions, by voice</text>
<text x="214" y="565.5" text-anchor="start" font-size="12" fill="#52627a">("teach me KYC") or click.</text>
<rect x="418" y="490" width="198" height="170" rx="10" fill="#eaf1fe" stroke="#9dbaf5" stroke-width="1.2"/>
<text x="432" y="514" text-anchor="start" font-size="14.5" font-weight="700" fill="#2563eb">2a · Voice class</text>
<text x="432" y="532.5" text-anchor="start" font-size="12" fill="#52627a">Sage teaches step by step,</text>
<text x="432" y="549" text-anchor="start" font-size="12" fill="#52627a">shows each step on screen,</text>
<text x="432" y="565.5" text-anchor="start" font-size="12" fill="#52627a">checks understanding.</text>
<path d="M398,575 L416,575" fill="none" stroke="#52627a" stroke-width="1.6"  marker-end="url(#a-muted)" />
<rect x="636" y="490" width="198" height="170" rx="10" fill="#ffffff" stroke="#c9d3e0" stroke-width="1.2"/>
<text x="650" y="514" text-anchor="start" font-size="14.5" font-weight="700" fill="#0b1b33">2b · Self-paced</text>
<text x="650" y="532.5" text-anchor="start" font-size="12" fill="#52627a">Read the Work Map and</text>
<text x="650" y="549" text-anchor="start" font-size="12" fill="#52627a">replay the expert's</text>
<text x="650" y="565.5" text-anchor="start" font-size="12" fill="#52627a">screen at each step.</text>
<path d="M616,575 L634,575" fill="none" stroke="#52627a" stroke-width="1.6"  marker-end="url(#a-muted)" />
<rect x="854" y="490" width="198" height="170" rx="10" fill="#ffffff" stroke="#c9d3e0" stroke-width="1.2"/>
<text x="868" y="514" text-anchor="start" font-size="14.5" font-weight="700" fill="#0b1b33">3 · Ask the rule</text>
<text x="868" y="532.5" text-anchor="start" font-size="12" fill="#52627a">"Can I approve 7,200 €</text>
<text x="868" y="549" text-anchor="start" font-size="12" fill="#52627a">over the PO?" from</text>
<text x="868" y="565.5" text-anchor="start" font-size="12" fill="#52627a">any screen.</text>
<path d="M834,575 L852,575" fill="none" stroke="#52627a" stroke-width="1.6"  marker-end="url(#a-muted)" />
<rect x="1072" y="490" width="198" height="170" rx="10" fill="#fef3c7" stroke="#e9b949" stroke-width="1.2"/>
<text x="1086" y="514" text-anchor="start" font-size="14.5" font-weight="700" fill="#92400e">4 · Guardrail check</text>
<text x="1086" y="532.5" text-anchor="start" font-size="12" fill="#52627a">Sage stops a wrong</text>
<text x="1086" y="549" text-anchor="start" font-size="12" fill="#52627a">decision, citing expert,</text>
<text x="1086" y="565.5" text-anchor="start" font-size="12" fill="#52627a">step and screen moment.</text>
<path d="M1052,575 L1070,575" fill="none" stroke="#52627a" stroke-width="1.6"  marker-end="url(#a-muted)" />
<path d="M1007.5,280 L1007.5,330" fill="none" stroke="#92400e" stroke-width="2"  marker-end="url(#a-amber)" />
<path d="M299,440 L299,490" fill="none" stroke="#92400e" stroke-width="2"  marker-end="url(#a-amber)" />
<path d="M1171,440 L1171,490" fill="none" stroke="#92400e" stroke-width="2"  marker-end="url(#a-amber)" />
<rect x="30" y="690" width="1240" height="62" rx="12" fill="#0b1b33"/>
<text x="50" y="716" font-size="13" font-weight="700" fill="#ffffff">One voice, everywhere in the app</text>
<text x="50" y="737" font-size="12" fill="#c7d2e3">"Take me to Learn" · "Start recording" · "Teach me the insurance claim" · "Open the invoices workflow" · "Next step" · "What's the rule for…?"</text>
</svg>

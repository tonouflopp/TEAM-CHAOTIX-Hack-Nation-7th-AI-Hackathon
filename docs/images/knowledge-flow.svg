<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="452" viewBox="0 0 1300 452" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
  <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1b33"/></marker>
  <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker>
  <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#166534"/></marker>
  <marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b21b6"/></marker>
  <marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52627a"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1299" height="451" rx="18" fill="#ffffff" stroke="#c9d3e0"/>
<text x="32" y="46" font-size="22" font-weight="700" fill="#0b1b33">How an organisation's knowledge gets into Sage</text>
<text x="32" y="70" font-size="13.5" fill="#52627a">From a recorded session to an answer a new hire can trust, with personal data removed on the way.</text>
<rect x="32" y="110" width="228" height="200" rx="10" fill="#ffffff" stroke="#c9d3e0" stroke-width="1.2"/>
<text x="46" y="134" text-anchor="start" font-size="16" font-weight="700" fill="#0b1b33">1  Capture</text>
<text x="46" y="152.5" text-anchor="start" font-size="12" fill="#52627a">Experts record real work in</text>
<text x="46" y="169" text-anchor="start" font-size="12" fill="#52627a">their own tools: ERP, CRM,</text>
<text x="46" y="185.5" text-anchor="start" font-size="12" fill="#52627a">spreadsheets, back office.</text>
<text x="46" y="202" text-anchor="start" font-size="12" fill="#52627a"></text>
<text x="46" y="218.5" text-anchor="start" font-size="12" fill="#52627a">Sage asks for the reasons</text>
<text x="46" y="235" text-anchor="start" font-size="12" fill="#52627a">and limits the screen</text>
<text x="46" y="251.5" text-anchor="start" font-size="12" fill="#52627a">cannot show.</text>
<rect x="290" y="110" width="228" height="200" rx="10" fill="#dcfce7" stroke="#86c99a" stroke-width="1.2"/>
<text x="304" y="134" text-anchor="start" font-size="16" font-weight="700" fill="#166534">2  Protect</text>
<text x="304" y="152.5" text-anchor="start" font-size="12" fill="#52627a">Vision describes actions,</text>
<text x="304" y="169" text-anchor="start" font-size="12" fill="#52627a">not people ([PERSONA]).</text>
<text x="304" y="185.5" text-anchor="start" font-size="12" fill="#52627a">Presidio masks names,</text>
<text x="304" y="202" text-anchor="start" font-size="12" fill="#52627a">emails, IBANs, IDs, phones.</text>
<text x="304" y="218.5" text-anchor="start" font-size="12" fill="#52627a">Off-record leaves a gap.</text>
<text x="304" y="235" text-anchor="start" font-size="12" fill="#52627a">Thumbnails are blurred so</text>
<text x="304" y="251.5" text-anchor="start" font-size="12" fill="#52627a">no data can be read.</text>
<path d="M262,210 L287,210" fill="none" stroke="#0b1b33" stroke-width="2"  marker-end="url(#a-ink)" />
<rect x="548" y="110" width="228" height="200" rx="10" fill="#ffffff" stroke="#c9d3e0" stroke-width="1.2"/>
<text x="562" y="134" text-anchor="start" font-size="16" font-weight="700" fill="#0b1b33">3  Organise</text>
<text x="562" y="152.5" text-anchor="start" font-size="12" fill="#52627a">Sessions are titled by topic</text>
<text x="562" y="169" text-anchor="start" font-size="12" fill="#52627a">and attached to a workflow,</text>
<text x="562" y="185.5" text-anchor="start" font-size="12" fill="#52627a">owner and tags. Existing</text>
<text x="562" y="202" text-anchor="start" font-size="12" fill="#52627a">org sessions sit alongside</text>
<text x="562" y="218.5" text-anchor="start" font-size="12" fill="#52627a">new recordings in one</text>
<text x="562" y="235" text-anchor="start" font-size="12" fill="#52627a">knowledge base.</text>
<path d="M520,210 L545,210" fill="none" stroke="#0b1b33" stroke-width="2"  marker-end="url(#a-ink)" />
<rect x="806" y="110" width="228" height="200" rx="10" fill="#fef3c7" stroke="#e9b949" stroke-width="1.2"/>
<text x="820" y="134" text-anchor="start" font-size="16" font-weight="700" fill="#92400e">4  Structure</text>
<text x="820" y="152.5" text-anchor="start" font-size="12" fill="#52627a">Each session becomes a</text>
<text x="820" y="169" text-anchor="start" font-size="12" fill="#52627a">Work Map. Every reason</text>
<text x="820" y="185.5" text-anchor="start" font-size="12" fill="#52627a">and guardrail keeps:</text>
<text x="820" y="202" text-anchor="start" font-size="12" fill="#52627a">• the expert's exact words</text>
<text x="820" y="218.5" text-anchor="start" font-size="12" fill="#52627a">• the step it belongs to</text>
<text x="820" y="235" text-anchor="start" font-size="12" fill="#52627a">• the screen moment</text>
<path d="M778,210 L803,210" fill="none" stroke="#0b1b33" stroke-width="2"  marker-end="url(#a-ink)" />
<rect x="1064" y="110" width="228" height="200" rx="10" fill="#eaf1fe" stroke="#9dbaf5" stroke-width="1.2"/>
<text x="1078" y="134" text-anchor="start" font-size="16" font-weight="700" fill="#2563eb">5  Deliver</text>
<text x="1078" y="152.5" text-anchor="start" font-size="12" fill="#52627a">Voice classes, self-paced</text>
<text x="1078" y="169" text-anchor="start" font-size="12" fill="#52627a">lessons and live guardrail</text>
<text x="1078" y="185.5" text-anchor="start" font-size="12" fill="#52627a">checks over MCP.</text>
<text x="1078" y="202" text-anchor="start" font-size="12" fill="#52627a"></text>
<text x="1078" y="218.5" text-anchor="start" font-size="12" fill="#52627a">Explanations are local:</text>
<text x="1078" y="235" text-anchor="start" font-size="12" fill="#52627a">your rules, your people,</text>
<text x="1078" y="251.5" text-anchor="start" font-size="12" fill="#52627a">your screens.</text>
<path d="M1036,210 L1061,210" fill="none" stroke="#0b1b33" stroke-width="2"  marker-end="url(#a-ink)" />
<rect x="32" y="340" width="1260" height="86" rx="12" fill="#f6f8fb" stroke="#c9d3e0"/>
<text x="52" y="368" font-size="13.5" font-weight="700" fill="#0b1b33">Example answer, grounded in the organisation's own session</text>
<text x="52" y="392" font-size="12.5" fill="#0b1b33">Learner: "I'll approve this 7,200 € invoice, it's only a bit over the PO."</text>
<text x="52" y="412" font-size="12.5" fill="#92400e">Sage: "Priya would stop here: anything over 5,000 € or 10% over the PO needs the finance lead's sign-off. Step 4 of her invoice class, at 05:45."</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="836" viewBox="0 0 1300 836" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
  <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1b33"/></marker>
  <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker>
  <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#166534"/></marker>
  <marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b21b6"/></marker>
  <marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52627a"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1299" height="835" rx="18" fill="#ffffff" stroke="#c9d3e0"/>
<text x="32" y="46" font-size="22" font-weight="700" fill="#0b1b33">How Sage's agents communicate</text>
<text x="32" y="70" font-size="13.5" fill="#52627a">One voice agent, one browser app and one API: each piece has a single job, and personal data is removed before anything is stored.</text>
<rect x="30" y="150" width="170" height="84" rx="10" fill="#0b1b33" stroke="#0b1b33" stroke-width="1.2"/>
<text x="115" y="180.75" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">Expert</text>
<text x="115" y="199.25" text-anchor="middle" font-size="12" fill="#c7d2e3">Works as usual and</text>
<text x="115" y="215.75" text-anchor="middle" font-size="12" fill="#c7d2e3">explains out loud</text>
<rect x="30" y="470" width="170" height="84" rx="10" fill="#0b1b33" stroke="#0b1b33" stroke-width="1.2"/>
<text x="115" y="500.75" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">Learner</text>
<text x="115" y="519.25" text-anchor="middle" font-size="12" fill="#c7d2e3">Studies, practises,</text>
<text x="115" y="535.75" text-anchor="middle" font-size="12" fill="#c7d2e3">makes decisions</text>
<rect x="250" y="100" width="320" height="680" rx="14" fill="#f6f8fb" stroke="#c9d3e0" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="266" y="126" font-size="15" font-weight="700" fill="#0b1b33">Sage web app</text>
<text x="266" y="144" font-size="12" fill="#52627a">Runs in the user's browser (Chrome / Edge)</text>
<rect x="268" y="160" width="284" height="66" rx="10" fill="#ffffff" stroke="#c9d3e0" stroke-width="1.2"/>
<text x="282" y="181.75" text-anchor="start" font-size="14.5" font-weight="700" fill="#0b1b33">Screen capture</text>
<text x="282" y="200.25" text-anchor="start" font-size="12" fill="#52627a">Samples frames for analysis;</text>
<text x="282" y="216.75" text-anchor="start" font-size="12" fill="#52627a">keeps a blurred thumbnail</text>
<rect x="268" y="246" width="284" height="66" rx="10" fill="#eaf1fe" stroke="#9dbaf5" stroke-width="1.2"/>
<text x="282" y="267.75" text-anchor="start" font-size="14.5" font-weight="700" fill="#2563eb">Pause detector</text>
<text x="282" y="286.25" text-anchor="start" font-size="12" fill="#52627a">Screen still + nobody speaking</text>
<text x="282" y="302.75" text-anchor="start" font-size="12" fill="#52627a">→ Sage may ask one question</text>
<rect x="268" y="332" width="284" height="66" rx="10" fill="#eaf1fe" stroke="#9dbaf5" stroke-width="1.2"/>
<text x="282" y="353.75" text-anchor="start" font-size="14.5" font-weight="700" fill="#2563eb">Floating widget</text>
<text x="282" y="372.25" text-anchor="start" font-size="12" fill="#52627a">Always-on-top window that</text>
<text x="282" y="388.75" text-anchor="start" font-size="12" fill="#52627a">follows the expert into any app</text>
<rect x="268" y="418" width="284" height="66" rx="10" fill="#dcfce7" stroke="#86c99a" stroke-width="1.2"/>
<text x="282" y="439.75" text-anchor="start" font-size="14.5" font-weight="700" fill="#166534">Off the record</text>
<text x="282" y="458.25" text-anchor="start" font-size="12" fill="#52627a">Stops capture and questions;</text>
<text x="282" y="474.75" text-anchor="start" font-size="12" fill="#52627a">leaves only a gap marker</text>
<rect x="268" y="504" width="284" height="66" rx="10" fill="#ffffff" stroke="#c9d3e0" stroke-width="1.2"/>
<text x="282" y="525.75" text-anchor="start" font-size="14.5" font-weight="700" fill="#0b1b33">Lesson player</text>
<text x="282" y="544.25" text-anchor="start" font-size="12" fill="#52627a">Work Map: steps, reasons,</text>
<text x="282" y="560.75" text-anchor="start" font-size="12" fill="#52627a">guardrails, screen moments</text>
<rect x="268" y="590" width="284" height="66" rx="10" fill="#eaf1fe" stroke="#9dbaf5" stroke-width="1.2"/>
<text x="282" y="611.75" text-anchor="start" font-size="14.5" font-weight="700" fill="#2563eb">Client-tool handler</text>
<text x="282" y="630.25" text-anchor="start" font-size="12" fill="#52627a">Executes the agent's actions:</text>
<text x="282" y="646.75" text-anchor="start" font-size="12" fill="#52627a">navigate, start_class, show_step</text>
<rect x="268" y="676" width="284" height="66" rx="10" fill="#ffffff" stroke="#c9d3e0" stroke-width="1.2"/>
<text x="282" y="697.75" text-anchor="start" font-size="14.5" font-weight="700" fill="#0b1b33">Session timeline</text>
<text x="282" y="716.25" text-anchor="start" font-size="12" fill="#52627a">Screen events + transcript</text>
<text x="282" y="732.75" text-anchor="start" font-size="12" fill="#52627a">sent for redaction and storage</text>
<rect x="720" y="100" width="320" height="250" rx="14" fill="#eaf1fe" stroke="#9dbaf5" stroke-width="1.2" stroke-dasharray="0"/>
<text x="736" y="126" font-size="15" font-weight="700" fill="#2563eb">Sage voice agent</text>
<text x="736" y="144" font-size="12" fill="#52627a">ElevenLabs Conversational AI</text>
<text x="736" y="180" font-size="12.5" fill="#0b1b33">• Speech-to-text → LLM → text-to-speech</text>
<text x="736" y="205" font-size="12.5" fill="#0b1b33">• Apprentice mode: asks why, only at pauses</text>
<text x="736" y="230" font-size="12.5" fill="#0b1b33">• Tutor mode: teaches in the expert's words</text>
<text x="736" y="255" font-size="12.5" fill="#0b1b33">• Guardrails first: checks rules before decisions</text>
<text x="736" y="280" font-size="12.5" fill="#0b1b33">• Answers in the language the user speaks</text>
<text x="736" y="305" font-size="12.5" fill="#0b1b33">• Skip turn: stays silent while the expert works</text>
<rect x="720" y="400" width="320" height="380" rx="14" fill="#f6f8fb" stroke="#c9d3e0" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="736" y="426" font-size="15" font-weight="700" fill="#0b1b33">Sage server</text>
<text x="736" y="444" font-size="12" fill="#52627a">Node / Express API (Vercel)</text>
<rect x="738" y="456" width="284" height="70" rx="10" fill="#fef3c7" stroke="#e9b949" stroke-width="1.2"/>
<text x="752" y="479.75" text-anchor="start" font-size="14.5" font-weight="700" fill="#92400e">Guardrails MCP server</text>
<text x="752" y="498.25" text-anchor="start" font-size="12" fill="#52627a">POST /api/mcp · search_guardrails,</text>
<text x="752" y="514.75" text-anchor="start" font-size="12" fill="#52627a">get_class_guardrails (read-only)</text>
<rect x="738" y="542" width="284" height="70" rx="10" fill="#dcfce7" stroke="#86c99a" stroke-width="1.2"/>
<text x="752" y="565.75" text-anchor="start" font-size="14.5" font-weight="700" fill="#166534">Redaction &amp; session store</text>
<text x="752" y="584.25" text-anchor="start" font-size="12" fill="#52627a">POST /api/session/:id/events</text>
<text x="752" y="600.75" text-anchor="start" font-size="12" fill="#52627a">nothing is stored unredacted</text>
<rect x="738" y="628" width="284" height="62" rx="10" fill="#ede9fe" stroke="#b4a3ee" stroke-width="1.2"/>
<text x="752" y="656" text-anchor="start" font-size="14.5" font-weight="700" fill="#5b21b6">Screen understanding</text>
<text x="752" y="674.5" text-anchor="start" font-size="12" fill="#52627a">POST /api/frame → business events</text>
<rect x="738" y="704" width="284" height="62" rx="10" fill="#ffffff" stroke="#c9d3e0" stroke-width="1.2"/>
<text x="752" y="732" text-anchor="start" font-size="14.5" font-weight="700" fill="#0b1b33">Session services</text>
<text x="752" y="750.5" text-anchor="start" font-size="12" fill="#52627a">Signed voice URL · topic titles</text>
<rect x="1090" y="456" width="180" height="70" rx="10" fill="#fef3c7" stroke="#e9b949" stroke-width="1.2"/>
<text x="1180" y="479.75" text-anchor="middle" font-size="14.5" font-weight="700" fill="#92400e">Knowledge base</text>
<text x="1180" y="498.25" text-anchor="middle" font-size="12" fill="#52627a">Organisation sessions +</text>
<text x="1180" y="514.75" text-anchor="middle" font-size="12" fill="#52627a">newly saved sessions</text>
<rect x="1090" y="542" width="180" height="70" rx="10" fill="#dcfce7" stroke="#86c99a" stroke-width="1.2"/>
<text x="1180" y="565.75" text-anchor="middle" font-size="14.5" font-weight="700" fill="#166534">Presidio</text>
<text x="1180" y="584.25" text-anchor="middle" font-size="12" fill="#52627a">Detects and masks</text>
<text x="1180" y="600.75" text-anchor="middle" font-size="12" fill="#52627a">personal data</text>
<rect x="1090" y="628" width="180" height="62" rx="10" fill="#ede9fe" stroke="#b4a3ee" stroke-width="1.2"/>
<text x="1180" y="656" text-anchor="middle" font-size="14.5" font-weight="700" fill="#5b21b6">Claude (Anthropic)</text>
<text x="1180" y="674.5" text-anchor="middle" font-size="12" fill="#52627a">Vision + titling</text>
<path d="M200,205 L268,205" fill="none" stroke="#0b1b33" stroke-width="1.6"  marker-end="url(#a-ink)" marker-start="url(#a-ink)"/>

<text x="234" y="182" text-anchor="middle" font-size="10.5" font-weight="400" fill="#52627a">screen,</text>
<text x="234" y="195.5" text-anchor="middle" font-size="10.5" font-weight="400" fill="#52627a">voice</text>
<path d="M200,525 L268,525" fill="none" stroke="#0b1b33" stroke-width="1.6"  marker-end="url(#a-ink)" marker-start="url(#a-ink)"/>

<text x="234" y="502" text-anchor="middle" font-size="10.5" font-weight="400" fill="#52627a">voice,</text>
<text x="234" y="515.5" text-anchor="middle" font-size="10.5" font-weight="400" fill="#52627a">clicks</text>

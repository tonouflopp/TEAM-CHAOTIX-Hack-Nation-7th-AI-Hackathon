<text x="654" y="563" text-anchor="middle" font-size="10.5" font-weight="400" fill="#166534">timeline in, redacted back</text>
<path d="M570,659 L738,659" fill="none" stroke="#5b21b6" stroke-width="1.6"  marker-end="url(#a-violet)" marker-start="url(#a-violet)"/>
<rect x="587.26" y="632.5" width="133.48000000000002" height="19.5" rx="4" fill="#ffffff" opacity="0.92"/>
